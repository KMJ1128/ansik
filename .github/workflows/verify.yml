name: Verify Android

on:
  push:
    branches: [ master, fix/onestore-privacy-consent ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit test and assemble debug
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
